# .github/workflows/live-feed.yml
# Builds the live-platform feed (what the bot published on the site and on WhatsApp + the run
# history) and sends it to the Mr_Amwal Live platform, which then notifies every subscribed phone.
# Runs every 10 minutes and right after any other workflow finishes.  No secrets needed: the
# platform verifies the job's own GITHUB_TOKEN against this repository.
name: Live feed
on:
  schedule:
    - cron: "17 * * * *"   # hourly safety net; the workflow_run triggers below give the real-time updates
  workflow_dispatch:
  workflow_run:
    workflows: ["Hourly news", "WhatsApp Breaking News", "WhatsApp Morning Report", "WhatsApp Manual Message", "WhatsApp Economic Calendar", "US Data Watch", "WhatsApp to site"]
    types: [completed]
concurrency:
  group: live-feed
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  LIVE_URL: https://mr-amwal-live.baraah-m-melhem.workers.dev
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build feed.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_feed.py
      - name: Send feed to the live platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST "$LIVE_URL/api/feed" \
            -H "content-type: application/json" -H "x-github-token: $GITHUB_TOKEN" \
            --data-binary @app/feed.json
