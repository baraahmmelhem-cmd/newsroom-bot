name: WhatsApp Economic Calendar

on:
  workflow_run:            # right after "Hourly news" (dispatched every hour); the job runs only on the 8:00 Amman one
    workflows: ["Hourly news"]   # chained: the WhatsApp jobs run one after another so none is cancelled
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whatsapp-calendar   # own group so it is never cancelled by another WhatsApp job
  cancel-in-progress: false

jobs:
  gate:   # owner 18 Nov: today's agenda Mon-Fri 08:00 Amman, the week ahead Saturday 14:00 Amman (time of the Hourly news run)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          EV: ${{ github.event_name }}
          CREATED: ${{ github.event.workflow_run.created_at }}
        run: |
          if [ "$EV" = "workflow_dispatch" ]; then echo go=true >> "$GITHUB_OUTPUT"; exit 0; fi
          H=$(date -u -d "$CREATED" +%H); D=$(date -u -d "$CREATED" +%u)
          if { [ "$D" -le 5 ] && [ "$H" = "05" ]; } || { [ "$D" = "6" ] && [ "$H" = "11" ]; }; then echo go=true >> "$GITHUB_OUTPUT"; else echo go=false >> "$GITHUB_OUTPUT"; fi
          echo "created=$CREATED hour=$H day=$D"
  calendar:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      SESSION_KEY: ${{ secrets.SESSION_KEY }}
      GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: whatsapp-report
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # newest WhatsApp session, even if this run waited in the queue

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build today's and tomorrow's US calendar
        id: pick
        run: node src/calendar.js pick

      - name: Cache node modules
        if: steps.pick.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: whatsapp-report/node_modules
          key: wa-node-${{ hashFiles('whatsapp-report/package.json') }}

      - name: Install
        if: steps.pick.outputs.found == 'true'
        run: '[ -d node_modules ] || npm install --no-audit --no-fund'

      - name: Restore WhatsApp session
        if: steps.pick.outputs.found == 'true'
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SESSION_KEY -in wa-session.enc | tar xz

      - name: Send to WhatsApp
        if: steps.pick.outputs.found == 'true'
        run: node src/calendar.js send

      - name: Save session
        if: always() && steps.pick.outputs.found == 'true'
        run: |
          if [ -d wa-session ] && [ -f wa-session/creds.json ]; then
            tar cz wa-session | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SESSION_KEY -out wa-session.enc
          fi
          git config user.name "whatsapp-calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add wa-session.enc
          if ! git diff --cached --quiet; then
            git commit -m "chore: WhatsApp session [skip ci]"
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
