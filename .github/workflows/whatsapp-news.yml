name: WhatsApp Breaking News

on:
  workflow_run:            # runs right after "Hourly news", which is dispatched every hour on the hour
    workflows: ["Hourly news"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whatsapp-report   # never use the WhatsApp session at the same time as the daily reports
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      SESSION_KEY: ${{ secrets.SESSION_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ALERTS_FRESH_MIN: '75'
    defaults:
      run:
        working-directory: whatsapp-report
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # newest WhatsApp session, even if this run waited in the queue

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pick new important stories
        id: pick
        run: node src/alerts.js pick

      - name: Cache node modules
        if: steps.pick.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: whatsapp-report/node_modules
          key: wa-node-${{ hashFiles('whatsapp-report/package.json') }}

      - name: Install
        if: steps.pick.outputs.found == 'true'
        run: '[ -d node_modules ] || npm install --no-audit --no-fund'

      - name: Restore WhatsApp session
        if: steps.pick.outputs.found == 'true'
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SESSION_KEY -in wa-session.enc | tar xz

      - name: Send to WhatsApp
        if: steps.pick.outputs.found == 'true'
        run: node src/alerts.js send

      - name: Save session and sent list
        if: always() && steps.pick.outputs.found == 'true'
        run: |
          if [ -d wa-session ] && [ -f wa-session/creds.json ]; then
            tar cz wa-session | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SESSION_KEY -out wa-session.enc
          fi
          git config user.name "whatsapp-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add wa-session.enc
          [ -f alerts-sent.json ] && git add alerts-sent.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: WhatsApp alerts state [skip ci]"
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
