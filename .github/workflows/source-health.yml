name: Morning source check

on:
  workflow_run:            # every hour after "Hourly news"; the job only runs on the 03:00 UTC (6:00 Amman) one
    workflows: ["Hourly news"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.workflow_run.created_at, 'T03:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check news feeds and price sources
        env:
          GREENAPI_API_TOKEN: ${{ secrets.GREENAPI_API_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        run: python scripts/health.py
      - name: Save status
        if: always()
        run: |
          git config user.name "newsroom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feeds_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: morning source check [skip ci]"
            git pull --rebase -X theirs --autostash origin main || true
            git push
          fi
