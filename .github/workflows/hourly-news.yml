name: Hourly news
on:
  schedule:
    - cron: "5,35,50 * * * *"
  workflow_dispatch:
concurrency:
  group: newsroom
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Write and publish one news item
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWSROOM_KEY: ${{ secrets.NEWSROOM_KEY }}
          NEWSROOM_SESSION: ${{ secrets.NEWSROOM_SESSION }}
        run: python scripts/run.py
      - name: Save state
        run: |
          git config user.name "newsroom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Update posted.json" && git pull --rebase && git push)
